# =============================================================================
# General Settings
# =============================================================================

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Mouse support
set -g mouse on

# Vi mode
set-window-option -g mode-keys vi

# Renumber tabs on default
 set-option -g renumber-windows on

# Name new sessions after their directory; number only on name collision
set-hook -g session-created "run-shell \"~/.tmux/name-session.sh '#{session_id}' '#{session_name}' '#{pane_current_path}'\""

# =============================================================================
# Status Bar
# =============================================================================

set -g status-style bg='#2e3440',fg='#d8dee9'

set -g status-left-length 30
set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold] #S #[fg=#88c0d0,bg=#2e3440,nobold] "

set -g window-status-format "#[fg=#d8dee9,bg=#2e3440] #I #W "
set -g window-status-current-format "#[fg=#2e3440,bg=#81a1c1,bold] #I #W #[fg=#81a1c1,bg=#2e3440,nobold]"

set -g status-right-length 150
set -g status-right "#[fg=#d8dee9,bg=#2e3440] %H:%M:%S #[fg=#2e3440,bg=#a3be8c] %d-%b-%y #[fg=#2e3440,bg=#b48ead]"

set -g status-position top

# =============================================================================
# Pane & Message Styling
# =============================================================================

set -g pane-border-style fg='#4c566a'
set -g pane-active-border-style fg='#88c0d0'
set -g message-style bg='#3b4252',fg='#d8dee9'

# =============================================================================
# Key Bindings
# =============================================================================

# Resurrect save/restore/delete with visual feedback
bind-key S run-shell "~/.tmux/plugins/tmux-resurrect/scripts/save.sh && ls -t ~/.local/share/tmux/resurrect/tmux_resurrect_*.txt 2>/dev/null | tail -n +2 | xargs rm -f" \; display-message "Session saved!"
bind-key R new-window -n "restore" "~/.tmux/resurrect-picker.sh; tmux kill-window"
bind-key D new-window -n "delete-save" "~/.tmux/resurrect-delete.sh; tmux kill-window"

# Vi copy mode
bind-key -T copy-mode-vi j send-keys -X cursor-down
bind-key -T copy-mode-vi k send-keys -X cursor-up
bind-key -T copy-mode-vi J send-keys -X halfpage-down
bind-key -T copy-mode-vi K send-keys -X halfpage-up
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send-keys -X cancel

# =============================================================================
# Plugins
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '0'

# TPM must be the last line
run '~/.tmux/plugins/tpm/tpm'
